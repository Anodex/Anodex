# Packaging configuration for `npm run dist`.
# Kept intentionally minimal for the foundation — expand per-platform targets
# and code signing as the product matures.
appId: com.anodex.app
productName: Anodex
# Auto-update source (electron-updater reads this from app-update.yml, which
# electron-builder generates into the packaged app from this block).
# IMPORTANT: Anodex/Anodex is currently a PRIVATE repo. electron-updater can
# still fetch releases from a private repo, but only with a token present at
# check-time (GH_TOKEN env var, or a token baked into the build) — there is
# no such token wired up yet, so update checks will fail closed (a caught,
# logged error, not a crash) until either the repo goes public or a token is
# provisioned. `npm run dist -- --publish always` also needs GH_TOKEN set to
# actually upload a release.
publish:
  provider: github
  owner: Anodex
  repo: Anodex
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  # electron-builder copies production `node_modules` into the asar regardless
  # of the patterns above. Most of that is genuinely needed — `externalizeDeps`
  # keeps every main-process dependency out of the bundle so it resolves from
  # node_modules at runtime. These two groups are not.
  #
  # 1. Renderer-only libraries. Vite bundles them into out/renderer, so their
  #    package sources ship a second time for nothing. Verified: no file under
  #    src/main or src/preload imports any of them. If that ever changes, the
  #    app will fail at require-time in a packaged build but work in dev, so
  #    re-check this list before moving one of them into the main process.
  - '!node_modules/highlight.js/**/*'
  - '!node_modules/@xterm/**/*'
  - '!node_modules/zustand/**/*'
  - '!node_modules/immer/**/*'
  - '!node_modules/use-sync-external-store/**/*'
  - '!node_modules/diff/**/*'
  # 2. The parts of pdf.js that a text-only consumer never loads. Anodex uses
  #    exactly one entry point, `pdfjs-dist/legacy/build/pdf.mjs` (see
  #    email/attachmentText.ts), so the modern build, the viewer UI, the image
  #    decoders, and the render-time font data are all dead weight. `cmaps` is
  #    excluded because `cMapUrl` is not configured, so pdf.js cannot load them
  #    anyway — wiring that up is what would improve CJK text extraction, not
  #    shipping the files.
  - '!node_modules/pdfjs-dist/build/**/*'
  - '!node_modules/pdfjs-dist/web/**/*'
  - '!node_modules/pdfjs-dist/image_decoders/**/*'
  - '!node_modules/pdfjs-dist/cmaps/**/*'
  - '!node_modules/pdfjs-dist/standard_fonts/**/*'
  - '!node_modules/pdfjs-dist/types/**/*'
  # Source maps for shipped dependencies: never read in production, and they
  # are a large share of what several SDKs weigh. Note the narrow markdown
  # pattern — a blanket `*.md` exclusion would also drop the `LICENSE.md`
  # files some packages use, which are exactly what has to ship.
  - '!node_modules/**/*.map'
  - '!node_modules/**/{README,readme,CHANGELOG,changelog,CONTRIBUTING,SECURITY}.md'
  - '!node_modules/**/{test,tests,__tests__,example,examples,docs}/**/*'
# node-llama-cpp ships prebuilt binaries; keep them unpacked so they load at runtime.
asarUnpack:
  - node_modules/node-llama-cpp/**/*
  - node_modules/@node-llama-cpp/**/*
# The small embedding model for local semantic code search — bundled with the
# app itself (see EmbeddingService.ts), not downloaded at runtime. Lands at
# `process.resourcesPath/embedding-model/` in a packaged build.
extraResources:
  - from: resources/embedding-model
    to: embedding-model
  # Official llama.cpp runtime prepared by `npm run prepare:vision`. It stays
  # an implementation detail: Anodex starts it on loopback when a model has
  # an associated multimodal projector.
  - from: resources/llama-server
    to: llama-server
  # Native Windows desktop-control helper, prepared only on Windows. Other
  # platforms receive its README but never expose desktop control.
  - from: resources/windows-control
    to: windows-control
  # Sample personal skills, copied into `userData/skills` on first launch by
  # SkillStore.init() so a new install has a working skill library to read,
  # edit, or delete. Never read from here at runtime.
  - from: resources/skills
    to: skills
  # The bare Anodex glyph, used as the window icon for framed secondary
  # windows (the HTML preview pop-out). build/ below isn't in `files:`, so the
  # main process can't read the icons there at runtime — this is how it gets
  # one. Generated by scripts/generate-icons.mjs alongside them.
  - from: resources/brand
    to: brand
# Generated from src/renderer/assets/app-icon.png via scripts/generate-icons.mjs —
# re-run that script (not a manual edit) if the brand mark ever changes.
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: build/icon.icns
# A single self-contained executable the user marks executable and runs. No
# install step, so there is nothing for the branded installer shell to wrap —
# and no signing or notarization required, which makes Linux by a wide margin
# the cheapest platform for Anodex to ship on.
linux:
  target: AppImage
  category: Development
  icon: build/icon.png
  synopsis: A local-first AI assistant for coding help and general chat
  description: >-
    Anodex runs open-weight models on your own machine through llama.cpp.
    Conversations, projects, model weights, and settings stay in local files;
    cloud providers are opt-in per chat.
  # Shown in the desktop environment's launcher/menu once the AppImage is
  # integrated. StartupWMClass must match the app's window class or GNOME
  # treats a running Anodex as a second, unrelated icon in the dock.
  desktop:
    entry:
      Name: Anodex
      StartupWMClass: Anodex
      Keywords: AI;LLM;assistant;chat;developer;
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Keeps electron-builder's stock installer intact while allowing the
  # branded shell to receive real install-stage milestones.
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # A small, atmospheric extension of the in-app identity. NSIS uses 24-bit
  # bitmaps here, generated from the source artwork by `generate:installer-art`.
  installerSidebar: build/installer/installer-sidebar.bmp
  uninstallerSidebar: build/installer/installer-sidebar.bmp
  installerHeader: build/installer/installer-header.bmp
  runAfterFinish: true
