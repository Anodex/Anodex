name: Feature request
description: Something Anodex should do, or should do differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The problem you are trying to solve is the valuable half of this. The proposed solution is often not the one that ships — describe both, but do not worry if the shape changes.

        Anodex is maintained centrally, so this is a proposal rather than a plan. Some of the best changes in it started here.

  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: What are you actually trying to do, and where does Anodex get in the way?
      placeholder: 'When I …, I have to … every time, because …'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: How you imagine it working. Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: The workaround, if there is one. It says a lot about how much the gap costs.

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: Sketches, screenshots from other software, links.
