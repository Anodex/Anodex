name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Windows is what Anodex ships today; macOS and Linux are being brought up to
# the same bar. Both run here so that "it works on Linux" is a fact this
# workflow establishes rather than a hope. Note that Anodex cannot be
# cross-compiled: `prepare:vision` downloads the *host* platform's llama.cpp
# runtime, so every target has to build on its own runner regardless.
#
# Cost shape is deliberate. Lint, formatting, and typechecking cannot vary by
# OS, so they run once on Linux (1x billing) instead of three times. Only the
# jobs whose results genuinely differ by platform pay for a matrix, and macOS
# bills at 10x, so nothing goes there without a reason.
jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result. On a matrix whose whole purpose is
      # finding out what is broken where, stopping at the first failure hides
      # exactly the information the run exists to produce.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET for the Windows control helper
        if: matrix.os == 'windows-latest'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build Windows control helper
        if: matrix.os == 'windows-latest'
        run: dotnet build native/windows-control/Anodex.WindowsControl.csproj -c Release

      - name: Unit tests
        run: npm run test

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
