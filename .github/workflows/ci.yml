name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Windows runners, deliberately. Windows is the only platform Anodex is tested
# and released on (see ROADMAP.md), and part of the suite asserts real Windows
# path semantics — `workspace.test.ts` and `helpers.test.ts` check that a path
# like `C:\Windows\system32\notepad.exe` is rejected as outside the workspace.
# On Linux that string is not an absolute path at all, so those cases were not
# merely failing, they were unable to test the thing they exist to test.
# Move back to ubuntu-latest only alongside real cross-platform support.
jobs:
  quality:
    name: Lint, format, typecheck & unit tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

  build:
    name: Build application
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
