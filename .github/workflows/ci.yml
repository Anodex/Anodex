name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Windows is what Anodex ships today; macOS and Linux are being brought up to
# the same bar. Both run here so that "it works on Linux" is a fact this
# workflow establishes rather than a hope. Note that Anodex cannot be
# cross-compiled: `prepare:vision` downloads the *host* platform's llama.cpp
# runtime, so every target has to build on its own runner regardless — which
# is also why the Build job now fetches and starts that runtime rather than
# leaving all three platforms unexercised until a tag is pushed.
#
# Cost shape is deliberate. Lint, formatting, and typechecking cannot vary by
# OS, so they run once on Linux (1x billing) instead of three times. Only the
# jobs whose results genuinely differ by platform pay for a matrix, and macOS
# bills at 10x, so nothing goes there without a reason.
jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      # The compile error, rebuilt across a repository boundary. `Anodex/anodex-mobile` is built
      # against protocol/anodex-protocol.json and cannot typecheck against this repo, so a wire
      # change that does not regenerate the artifact breaks the phone at runtime, in another room,
      # with no stack trace. This regenerates and diffs rather than asking whether ipc.ts changed:
      # the likeliest breaking change is a renamed field in a sibling *.types.ts module, which
      # never touches ipc.ts at all.
      - name: Protocol contract is up to date
        run: npm run protocol:check

      # The same gate, for the half of the seam that is not types. The phone's palette,
      # spacing, radii and icon glyphs are copied from this repository by hand, and its own
      # tests say they "cannot see the desktop, so a value changed there and not here still
      # passes". This is that half made checkable: it found two glyphs already adrift — an
      # icon missing its dot, and a paperclip redrawn at different coordinates — neither of
      # which any test in either repository could see.
      - name: Design contract is current
        run: npm run design:check

  # A `commit-msg` hook already strips coding-agent attribution, and it works —
  # but a hook only runs where somebody installed it. Forty-one trailers reached
  # `main` in the five weeks after that hook landed, from worktrees without husky
  # wired, from `--no-verify`, and from merges made on github.com, and the
  # history has had to be rewritten more than once as a result. This is the same
  # rule enforced somewhere nobody configures.
  #
  # No `npm ci`: it is git and Node's standard library, so it costs seconds.
  attribution:
    name: No coding-agent attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history, and the pull request's own head rather than the synthetic
      # merge commit — the merge commit's message is GitHub's, not the author's.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check the commits this pull request adds
        run: npm run check:attribution -- "origin/${{ github.base_ref }}..HEAD"

  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result. On a matrix whose whole purpose is
      # finding out what is broken where, stopping at the first failure hides
      # exactly the information the run exists to produce.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET for the Windows control helper
        if: matrix.os == 'windows-latest'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Build Windows control helper
        if: matrix.os == 'windows-latest'
        run: dotnet build native/windows-control/Anodex.WindowsControl.csproj -c Release

      - name: Unit tests
        run: npm run test

      # Windows only, and not in `quality`, because the notice file is
      # per-installer: npm installs only the optional binaries matching the
      # host, so a Linux tree and a Windows tree legitimately produce different
      # files. Windows is what ships today and what the committed file was
      # generated for; the check refuses to compare across platforms rather than
      # pass on a file it cannot verify.
      - name: Third-party notices are up to date
        if: matrix.os == 'windows-latest'
        run: npm run notices:check

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Anodex cannot be cross-compiled, so the macOS and Linux runtimes only
      # ever exist on their own runners — and until this step they were only
      # ever fetched at tag time, by `npm run dist`. A runtime that fails to
      # download, loses its permission bits in a tarball, or cannot resolve
      # its shared libraries was therefore a failed release rather than a
      # failed pull request. Keyed on the script so bumping the pinned
      # llama.cpp release invalidates every platform's cache at once.
      - name: Cache the llama.cpp runtime
        uses: actions/cache@v4
        with:
          path: resources/llama-server
          key: llama-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-llama-server.mjs') }}

      - name: Prepare the vision runtime
        run: npm run prepare:vision

      # Starts the binary the way the app does rather than checking that a
      # file exists, which is the only version of this that can fail.
      - name: Verify the vision runtime runs
        run: node scripts/verify-vision-runtime.mjs
