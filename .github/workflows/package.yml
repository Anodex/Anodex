name: Package

# Produces the actual distributable for each platform.
#
# Separate from CI on purpose. CI runs on every push and proves the code
# compiles and passes tests; this downloads a ~90 MB llama.cpp runtime per
# platform and produces installers in the hundreds of megabytes, which is not
# something to do on every commit.
#
# Every target builds on its own runner because Anodex cannot be
# cross-compiled: `prepare:vision` fetches the *host* platform's llama.cpp
# runtime, so a Linux AppImage built on Windows would ship a Windows runtime
# and fail the moment a vision model loaded.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to package
        type: choice
        default: all
        options: [all, linux, windows, macos]
  push:
    tags: ['v*']

# Creating the release is a write to the repository, and the default token is
# read-only for workflows that were not started by a push to a branch.
permissions:
  contents: write

jobs:
  # The matrix is computed rather than declared because a job-level `if:`
  # cannot see the `matrix` context — it is evaluated before the matrix
  # expands. Filtering here means an unwanted platform never starts a runner
  # at all, which matters when macOS bills at 10x and most packaging changes
  # only affect one platform.
  targets:
    name: Choose targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        # A tag build always packages all three; only a manual run may narrow.
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
        run: |
          linux='{"name":"linux","os":"ubuntu-latest","artifact":"dist/*.AppImage"}'
          windows='{"name":"windows","os":"windows-latest","artifact":"dist/*.exe"}'
          macos='{"name":"macos","os":"macos-latest","artifact":"dist/*.dmg"}'
          case "$REQUESTED" in
            linux)   include="[$linux]" ;;
            windows) include="[$windows]" ;;
            macos)   include="[$macos]" ;;
            *)       include="[$linux,$windows,$macos]" ;;
          esac
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.name }})
    needs: targets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
      # One at a time, because publishing is not safe to run concurrently.
      #
      # Each platform's `--publish always` asks GitHub for the release matching
      # this tag and creates it if absent. Run in parallel, all three ask before
      # any has finished creating, and GitHub answers every one of them — v0.2.1
      # produced *two* releases on the same tag, created in the same second, with
      # the Windows installer and `latest.yml` on one and the macOS and Linux
      # builds on the other. Nothing failed and nothing was lost; the release was
      # simply half of itself, and `/releases/latest` picked one of the two.
      #
      # Serialising costs roughly twice the wall clock on a release build, which
      # happens rarely, and removes the race entirely: the first job creates the
      # release and the other two find it.
      max-parallel: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET for the Windows control helper
        if: matrix.name == 'windows'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      # A tag build publishes; a manual run does not. `--publish always` hands the
      # installer *and* the `latest*.yml` beside it to a GitHub release, and that
      # metadata is the part that matters: electron-updater reads it, not the
      # installer, and without it a release is just a file somebody can download by
      # hand. Uploading the artifacts to a release afterwards would miss it.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist

      - name: List what was produced
        shell: bash
        run: ls -lh dist/

      # Signed on the runner that built it, rather than in a later job that
      # would have to download every installer back again. The key arrives as a
      # secret and lands in RUNNER_TEMP, which is ephemeral; the trap removes it
      # even when signing fails.
      #
      # `--manifest` rather than a glob, for two reasons found the hard way on
      # v0.3.0. The signature must be named what the updater asks for, which is
      # the name in `latest.yml` (`Anodex-Setup-0.3.0.exe`), not the local
      # filename (`Anodex Setup 0.3.0.exe`) — GitHub turns those spaces into
      # dots, and the updater then requested a file that did not exist. And a
      # glob also signed the branded installer shell, which is not a release
      # artifact at all.
      #
      # `sign-release` checks the signature against the public key compiled into
      # the app, not against the key it just signed with. That is what catches a
      # rotated secret whose public half was never shipped — a release that
      # would look perfect here and be refused by every install.
      - name: Sign the installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.ANODEX_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::ANODEX_RELEASE_SIGNING_KEY is not set. Refusing to build a release nothing can verify."
            exit 1
          fi
          KEYFILE="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$KEYFILE"' EXIT
          echo "$SIGNING_KEY" > "$KEYFILE"
          node scripts/sign-release.mjs --key "$KEYFILE" --manifest dist

      # The `.sig` has to reach the release before it is published, because the
      # updater fetches it from there and refuses an update without one.
      - name: Attach the signature to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.sig --clobber

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: anodex-${{ matrix.name }}
          path: |
            ${{ matrix.artifact }}
            dist/latest*.yml
            dist/*.sig
          if-no-files-found: error
          # These run to hundreds of megabytes each; the default 90 days of
          # retention on every manual packaging run is not worth the storage.
          retention-days: 14

  # Publishing is what makes a release visible to electron-updater, and it
  # happens only after all three platforms have built AND signed. `needs` fails
  # if any matrix job did, so a partial release stays an invisible draft rather
  # than becoming the half-release v0.2.1 shipped as.
  publish:
    name: Publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make the release visible to the updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
