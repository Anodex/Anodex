<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Renderer content policy: only self-hosted resources, no remote code.
      `'unsafe-inline'` (scripts) and `ws:` (connect) are required by Vite's
      dev-time React Fast Refresh and HMR; production builds emit no inline
      scripts. The core protections are contextIsolation + nodeIntegration:false
      (see window.ts). Harden to a nonce-based policy when preparing a release.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws:"
    />
    <title>Anodex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
